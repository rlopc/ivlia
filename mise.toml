# Tool versions for development and CI. Python and pre-commit are not here: uv
# installs them (.python-version and uv.lock at the root).
# mise.lock uses lockfile format 4; older mise fails to read it.
min_version = "2026.11.5"

[tools]
node = "26.13.0"
# Here, not in package.json's packageManager: with it, pnpm 12 writes a
# two-document lockfile that GitHub's dependency graph cannot read.
pnpm = "12.17.0"
uv = "0.13.6"
just = "1.59.0"
lychee = "0.24.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
# On PATH, so actionlint also checks the `run:` scripts of the workflows.
shellcheck = "0.11.0"
zizmor = "1.32.0"

[env]
# The dev installation: its data stays in the repo's gitignored .dev/ folder.
IVLIA_ENV = "dev"
IVLIA_HOME = "{{ config_root }}/.dev"
# Root tools (OpenSpec, Prettier, markdownlint-cli2) by name, as OpenSpec's skills expect.
_.path = ["{{ config_root }}/node_modules/.bin"]

[settings]
# Same 7-day cooldown as uv and pnpm, for `mise upgrade` (just update-tools).
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
# `mise exec` never installs a missing tool on its own (with the network): tools
# are installed only by `just setup`, with `mise install --locked`.
exec_auto_install = false
