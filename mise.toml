# Tool versions for development and CI. Python is pinned by uv in
# backend/.python-version.
[tools]
node = "26.13.0"
# Here, not in package.json's packageManager: with it, pnpm 12 writes a
# two-document lockfile that GitHub's dependency graph cannot read.
pnpm = "12.17.0"
uv = "0.13.6"
just = "1.59.0"
lychee = "0.24.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
"pipx:pre-commit" = { version = "4.7.0", with = ["pre-commit-uv==4.4.1"] }

[env]
# Same 7-day cooldown when pre-commit resolves hook environments outside `just`.
UV_EXCLUDE_NEWER = "7 days"
# The dev installation: its data stays in the repo's gitignored .dev/ folder.
IVLIA_ENV = "dev"
IVLIA_HOME = "{{ config_root }}/.dev"
# Root tools (OpenSpec, Prettier, markdownlint-cli2) by name, as OpenSpec's skills expect.
_.path = ["{{ config_root }}/node_modules/.bin"]

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
