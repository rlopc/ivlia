# Every hook is local and runs a tool locked by mise.lock, pnpm-lock.yaml or
# uv.lock, through `mise exec` so it works even where mise is not
# activated (IDEs, git GUIs).
minimum_pre_commit_version: "4.5.0"

repos:
  - repo: local
    hooks:
      # pre-commit-hooks, from the root dev group (uv.lock), with the ids, entries
      # and types of its own hook definitions.
      - id: check-added-large-files
        name: check for added large files
        entry: mise exec -- uv run --locked check-added-large-files
        language: unsupported

      - id: check-case-conflict
        name: check for case conflicts
        entry: mise exec -- uv run --locked check-case-conflict
        language: unsupported

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: mise exec -- uv run --locked check-merge-conflict
        language: unsupported
        types: [text]

      # Only the text files that no formatter owns; the others get the same from
      # Prettier, Ruff or markdownlint. Keep in sync with the lint hook.
      - id: end-of-file-fixer
        name: fix end of files
        entry: mise exec -- uv run --locked end-of-file-fixer
        language: unsupported
        types: [text]
        files: &unowned (\.(toml|sh|sql)|(^|/)(justfile|\.gitignore|\.prettierignore|\.python-version))$

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: mise exec -- uv run --locked trailing-whitespace-fixer
        language: unsupported
        types: [text]
        files: *unowned

      # files, require_serial and --no-progress as in zizmor's own hook, plus
      # --offline: local checks never use the network, even with a GitHub token
      # in the environment.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --offline --no-progress
        language: unsupported
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true

      # require_serial as in shellcheck-py's hook: shellcheck can follow `source`.
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: unsupported
        types: [shell]
        require_serial: true

      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --no-banner
        language: unsupported
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- pnpm exec markdownlint-cli2 --fix
        language: unsupported
        types: [markdown]

      # Lint before format: fixes can leave code that needs reformatting.
      - id: ruff-check
        name: ruff check
        entry: mise exec -- uv run --locked --project backend ruff check --fix
        language: unsupported
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run --locked --project backend ruff format
        language: unsupported
        files: ^backend/.*\.py$

      # Every file, as `just fix` does: --ignore-unknown and .prettierignore
      # decide what Prettier formats.
      - id: prettier
        name: prettier
        entry: mise exec -- pnpm exec prettier --write --ignore-unknown
        language: unsupported
