# Every hook is local and runs a tool locked by mise.lock, pnpm-lock.yaml or
# uv.lock, through `mise exec` so it works even where mise is not
# activated (IDEs, git GUIs).
minimum_pre_commit_version: "4.5.0"

repos:
  - repo: local
    hooks:
      # pre-commit-hooks, from the root dev group (uv.lock), with the ids, entries,
      # types and stages of its own hook definitions.
      # --enforce-all: every file, not only new ones, so `just check` and CI check
      # too. The lockfiles are left out: they grow on their own.
      - id: check-added-large-files
        name: check for added large files
        entry: mise exec -- uv run --locked check-added-large-files --enforce-all
        language: unsupported
        exclude: ^(uv\.lock|pnpm-lock\.yaml|mise\.lock)$
        stages: [pre-commit, pre-push, manual]

      - id: check-case-conflict
        name: check for case conflicts
        entry: mise exec -- uv run --locked check-case-conflict
        language: unsupported

      # --assume-in-merge: also outside a merge (after a stash pop or a
      # cherry-pick), and in `just check` and CI.
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: mise exec -- uv run --locked check-merge-conflict --assume-in-merge
        language: unsupported
        types: [text]

      # Only the text files that no formatter owns; the others get the same from
      # Prettier, Ruff or markdownlint.
      - id: end-of-file-fixer
        name: fix end of files
        entry: mise exec -- uv run --locked end-of-file-fixer
        language: unsupported
        types: [text]
        files: &unowned (\.(toml|sh|sql)|(^|/)(justfile|\.gitignore|\.prettierignore|\.python-version))$
        stages: [pre-commit, pre-push, manual]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: mise exec -- uv run --locked trailing-whitespace-fixer
        language: unsupported
        types: [text]
        files: *unowned
        stages: [pre-commit, pre-push, manual]

      # files, require_serial and --no-progress as in zizmor's own hook, plus
      # --offline: local checks never use the network, even with a GitHub token
      # in the environment.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --offline --no-progress
        language: unsupported
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true

      # require_serial as in shellcheck-py's hook: shellcheck can follow `source`.
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: unsupported
        types: [shell]
        require_serial: true

      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --no-banner
        language: unsupported
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- pnpm exec markdownlint-cli2 --fix
        language: unsupported
        types: [markdown]

      # Lint before format: fixes can leave code that needs reformatting.
      - id: ruff-check
        name: ruff check
        entry: mise exec -- uv run --locked --project backend ruff check --fix
        language: unsupported
        files: ^(backend/.*|\.claude/hooks/[^/]+)\.py$

      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run --locked --project backend ruff format
        language: unsupported
        files: ^(backend/.*|\.claude/hooks/[^/]+)\.py$

      # From the root: ESLint 10 finds frontend/eslint.config.js from each file's
      # folder. Lint before format, as with Ruff.
      - id: eslint
        name: eslint
        entry: mise exec -- frontend/node_modules/.bin/eslint --fix --no-warn-ignored
        language: unsupported
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]

      # Every file: --ignore-unknown and .prettierignore
      # decide what Prettier formats.
      - id: prettier
        name: prettier
        entry: mise exec -- pnpm exec prettier --write --ignore-unknown
        language: unsupported
