# Every hook is local and runs a tool locked by mise.lock, pnpm-lock.yaml or
# uv.lock, through `mise exec` so it works even where mise is not
# activated (IDEs, git GUIs).
minimum_pre_commit_version: "4.5.0"

repos:
  - repo: local
    hooks:
      # files, require_serial and --no-progress as in zizmor's own hook.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --no-progress
        language: unsupported
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true

      # require_serial as in shellcheck-py's hook: shellcheck can follow `source`.
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: unsupported
        types: [shell]
        require_serial: true

      - id: gitleaks
        name: gitleaks
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --no-banner
        language: unsupported
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- pnpm exec markdownlint-cli2 --fix
        language: unsupported
        types: [markdown]

      # Lint before format: fixes can leave code that needs reformatting.
      - id: ruff-check
        name: ruff check
        entry: mise exec -- uv run --locked --project backend ruff check --fix
        language: unsupported
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run --locked --project backend ruff format
        language: unsupported
        files: ^backend/.*\.py$

      # Every file, as `just fix` does: --ignore-unknown and .prettierignore
      # decide what Prettier formats.
      - id: prettier
        name: prettier
        entry: mise exec -- pnpm exec prettier --write --ignore-unknown
        language: unsupported
