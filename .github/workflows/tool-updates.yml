# Dependabot does not update mise.toml. Monthly, this opens an issue (or
# comments on the open one) reminding to run `just update-tools`.
name: Tool updates

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Update the tools in mise.toml
          BODY: >-
            Dependabot does not update mise.toml. Run `just update-tools`,
            which upgrades every tool to its newest release at least 7 days
            old and updates mise.lock, and read its warnings. Also check the
            pins nothing updates: mise's version in .github/workflows/ci.yml and
            release.yml
            (the same as the Mac's, and min_version in mise.toml),
            pre-commit-uv in mise.toml and uv's required-version in
            backend/pyproject.toml. Then open a `build(deps)` pull request.
        run: |
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
