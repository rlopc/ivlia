# Releases with release-please: on each push to main it opens or updates the
# release PR; when that PR is merged it tags a release, and `publish` attaches
# the wheel (with the built SPA) and its provenance bundle.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The GitHub App token does the work: PRs and tags made with GITHUB_TOKEN
    # would not trigger CI, and the release PR needs its required checks.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps backend/pyproject.toml but not backend/uv.lock, which
  # records the project's version, so `--locked` would fail on the release PR.
  # It runs after every release-please pass, because each pass rewrites the
  # release branch.
  lock:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      BRANCH: release-please--branches--main
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Find the release PR branch
        id: branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/branches/$BRANCH" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      # No cache in this workflow: a poisoned cache must not reach a release.
      - if: steps.branch.outputs.exists == 'true'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.5
          install: false
          cache: false
      - if: steps.branch.outputs.exists == 'true'
        name: Update uv.lock and push it to the release PR
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
        run: |
          mise install uv
          mise exec -- uv lock --project backend
          if git diff --quiet -- backend/uv.lock; then
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit --message "chore(repo): update uv.lock" -- backend/uv.lock
          git push "https://x-access-token:${TOKEN}@github.com/${GH_REPO}.git" "HEAD:${BRANCH}"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # No cache in this workflow: a poisoned cache must not reach a release.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.5
          install: false
          cache: false
      - name: Build the SPA and the wheel
        run: |
          mise install node pnpm uv
          mise exec -- pnpm install --frozen-lockfile
          mise exec -- pnpm --filter ivlia-frontend run build
          mise exec -- uv build backend --wheel --out-dir dist
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          create-storage-record: false
      - name: Attach the wheel and its provenance bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          wheel="$(ls dist/*.whl)"
          cp "$BUNDLE" "${wheel}.sigstore.json"
          gh release upload "$TAG" "$wheel" "${wheel}.sigstore.json"
