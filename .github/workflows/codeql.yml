# CodeQL advanced setup: Python, JavaScript/TypeScript and the workflows.
name: CodeQL

on:
  # Only pull requests to main, as in GitHub's starter workflow: code scanning
  # compares a pull request with its base branch's analysis, which only main
  # has. Stacked pull requests are checked early by ci.yml.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No actions: read; GitHub's starter workflow needs it only in private
    # repositories.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Generated source code, which every other tool skips too.
          config: |
            paths-ignore:
              - frontend/src/contract
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
