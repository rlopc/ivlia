# Weekly check of external links. Internal links and anchors are checked
# offline by `just check`. On failure it opens an issue, or comments on the
# one already open.
name: Links

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --include-fragments
            --exclude-path node_modules --exclude-path .dev
            '**/*.md'
          output: lychee/report.md
          jobSummary: true
          fail: false
      - name: Open or update the issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Broken external links
        run: |
          number="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file lychee/report.md
          else
            gh issue create --title "$TITLE" --body-file lychee/report.md
          fi
