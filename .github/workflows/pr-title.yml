# The PR title becomes the squash commit message: it must follow
# Conventional Commits with one of the repository's scopes.
name: PR title

# pull_request, not pull_request_target: there are no fork PRs, and it needs
# no write token or dangerous trigger.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          scopes: |
            backend
            frontend
            cli
            docs
            ci
            repo
            deps
          requireScope: true
